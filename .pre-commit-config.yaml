# ==============================================================================
# pre-commit Configuration
#
# This file configures pre-commit hooks to automatically check and format code
# before each commit.
#
# Dependabot updates hook versions (see .github/dependabot.yml).
# To update hooks manually: pre-commit autoupdate
# To run all hooks on all files manually: pre-commit run --all-files
# ==============================================================================

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # --- Git & Sanity Checks ---
      - id: check-added-large-files
        name: Check for large files
        args: ["--maxkb=2048"] # Fail on files larger than 2 MB
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: check-yaml
        name: Check YAML syntax
      - id: detect-private-key
        name: Detect private keys

      # --- Code Formatting & Style ---
      - id: end-of-file-fixer
        name: Ensure files end with a newline
      - id: trailing-whitespace
        name: Trim trailing whitespace

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        name: Lint Ansible playbooks
        # Match the Python version in .github/workflows/ci.yml.
        language_version: python3.13
        files: \.(yml|yaml|j2)$
        always_run: false
        args:
          - "--profile=safety"
          - "--format=pep8"

  - repo: local
    hooks:
      # Block commits of a decrypted secrets file.
      - id: check-vault-encrypted
        name: Ensure secrets.yml is Vault encrypted
        entry: sh -c 'head -n1 "$1" | grep -q "^\$ANSIBLE_VAULT;"' --
        language: system
        files: ^vars/secrets\.yml$
