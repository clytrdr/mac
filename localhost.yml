- name: Setup local development environment
  hosts: localhost
  connection: local
  gather_facts: true
  # The roles use only ansible_facts.env. The minimal subset includes it.
  gather_subset:
    - "!all"
  become: false
  pre_tasks:
    - name: Check if vault variables file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/secrets.yml"
      register: secrets_file
      tags: always

    # Load the file only when it exists. A decryption error still fails the run.
    - name: Load vault variables if available
      ansible.builtin.include_vars: "{{ playbook_dir }}/vars/secrets.yml"
      when: secrets_file.stat.exists
      no_log: true
      tags: always
  # Each role gets one tag that matches its directory name.
  # The tag applies to all tasks and handlers of the role.
  roles:
    - { role: git, tags: git }
    - { role: homebrew, tags: homebrew }
    - { role: macos, tags: macos }
    - { role: zsh, tags: zsh }
    - { role: node, tags: node }
    - { role: ai, tags: ai }
    - { role: ghostty, tags: ghostty }
    - { role: vim, tags: vim }
