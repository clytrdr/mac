# Desktop apps. Each app updates itself. The role only installs them.
ai_casks:
  - claude
  - chatgpt
  - google-gemini

# Vendor install scripts put these CLIs in ~/.local/bin.
# The role installs Codex CLI with npm instead.
ai_cli_installers:
  - name: claude
    url: https://claude.ai/install.sh
  - name: agy
    url: https://antigravity.google/cli/install.sh

# Each CLI gets the same global instructions and the same skills.
ai_tools:
  - name: claude
    instructions: "{{ ansible_facts.env.HOME }}/.claude/CLAUDE.md"
    skills_dir: "{{ ansible_facts.env.HOME }}/.claude/skills"
  - name: codex
    instructions: "{{ ansible_facts.env.HOME }}/.codex/AGENTS.md"
    skills_dir: "{{ ansible_facts.env.HOME }}/.codex/skills"
  - name: antigravity
    instructions: "{{ ansible_facts.env.HOME }}/.gemini/GEMINI.md"
    skills_dir: "{{ ansible_facts.env.HOME }}/.gemini/skills"

# Directories outside the project that every CLI can read and write.
# Each entry includes all subdirectories.
ai_workspace_dirs:
  - "{{ ansible_facts.env.HOME }}/Code"
  - "{{ ansible_facts.env.HOME }}/Documents"

# Exact directory paths that Antigravity trusts. Subdirectories do not match.
# Claude Code and Codex CLI store trust in their own files, so the role does
# not manage it.
ai_trusted_projects:
  - "{{ ansible_facts.env.HOME }}/Code/back"
  - "{{ ansible_facts.env.HOME }}/Code/front"
  - "{{ ansible_facts.env.HOME }}/Code/infra"
  - "{{ ansible_facts.env.HOME }}/Code/mac"
  - "{{ ansible_facts.env.HOME }}/Code/ordnung"
  - "{{ ansible_facts.env.HOME }}/Documents"
  - "{{ ansible_facts.env.HOME }}/Downloads"

# Safe commands that run without a prompt or safety check in Claude Code
# and Antigravity. List only frequent commands.
# Do not list:
#   - Commands that change or delete data (git, terraform, docker, mv).
#   - Runners that auto mode ignores (python, npx, uv).
#   - Read-only commands that auto mode allows (ls, cat, rg).
ai_allowed_commands:
  - ansible-lint
  - pytest
  - pre-commit
  - playwright-cli

# MCP servers for all three CLIs. The role adds missing servers only.
# To update an entry, run `<cli> mcp remove <name>` for each CLI. Then run
# the playbook again.
ai_mcp_servers:
  - name: context7
    command: npx
    args: ["-y", "@upstash/context7-mcp@latest"]
  # PyCharm sets this port itself and can change it after an update.
  # Check the port in Settings > Tools > MCP Server.
  - name: pycharm
    url: "http://127.0.0.1:64462/stream"
  - name: terraform
    command: docker
    args: ["run", "-i", "--rm", "hashicorp/terraform-mcp-server"]
  - name: firecrawl
    command: npx
    args: ["-y", "firecrawl-mcp"]
    env:
      FIRECRAWL_API_KEY: "{{ firecrawl_api_key }}"
  # Uses the running Chrome. Turn on remote debugging at
  # chrome://inspect/#remote-debugging.
  - name: chrome-devtools
    command: npx
    args:
      - "-y"
      - "chrome-devtools-mcp@latest"
      - "--autoConnect"
      - "--no-usage-statistics"
      - "--no-performance-crux"

ai_mcp_server_names: "{{ ai_mcp_servers | map(attribute='name') | list }}"

# Extra Claude Code allow rules. They allow only ansible-playbook dry-runs
# and syntax checks. Real runs still go through the safety check.
ai_claude_allowed_rules:
  - Bash(ansible-playbook * --check*)
  - Bash(ansible-playbook * --syntax-check*)

# Folded for yaml[line-length]. YAML joins these lines with spaces.
ai_claude_status_line_command: >-
  input=$(cat);
  model=$(echo "$input" | jq -r '.model.display_name');
  effort=$(echo "$input" | jq -r '.effort.level // empty');
  if [ -n "$effort" ]; then printf '%s (%s)' "$model" "$effort";
  else printf '%s' "$model"; fi

# Claude Code plugins, as <name>@<marketplace>.
ai_claude_plugins:
  - frontend-design@claude-plugins-official

# CLI JSON settings. The role merges `managed` into each file. Managed
# lists replace current lists. Other keys stay as they are.
# zsh aliases set the model and effort. dir_mode sets the parent
# directory mode (default 0755).
ai_json_settings:
  - path: "{{ ansible_facts.env.HOME }}/.claude/settings.json"
    dir_mode: '0700'
    managed:
      env:
        CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: "1"
      permissions:
        allow: >-
          {{ ai_allowed_commands
             | map('regex_replace', '^', 'Bash(')
             | map('regex_replace', '$', ':*)') | list
             + ['Read', 'Glob', 'Grep', 'WebFetch', 'WebSearch']
             + ai_claude_allowed_rules
             + ai_mcp_server_names
             | map('regex_replace', '^', 'mcp__')
             | map('regex_replace', '$', '__*') | list }}
        # Leading // matches from the root and blocks secrets in all projects.
        deny:
          - Bash(gh repo delete:*)
          - Read(//**/.vault_pass)
          - Read(//**/.ansible_become_pass)
          - Read(//**/.env)
        defaultMode: auto
        additionalDirectories: "{{ ai_workspace_dirs }}"
      enabledPlugins: >-
        {{ dict(ai_claude_plugins | product([true])) }}
      statusLine:
        type: command
        command: "{{ ai_claude_status_line_command }}"
      skipAutoPermissionPrompt: true
  - path: "{{ ansible_facts.env.HOME }}/.gemini/antigravity-cli/settings.json"
    managed:
      permissions:
        allow: >-
          {{ ai_allowed_commands
             | map('regex_replace', '^', 'command(')
             | map('regex_replace', '$', ')') | list
             + ['read_url(*)']
             + ai_mcp_server_names
             | map('regex_replace', '^', 'mcp(')
             | map('regex_replace', '$', '/*)') | list
             + ai_workspace_dirs
             | map('regex_replace', '^', 'write_file(')
             | map('regex_replace', '$', ')') | list }}
      showFeedbackSurvey: false
      trustedWorkspaces: "{{ ai_trusted_projects }}"
