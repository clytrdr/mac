- name: Git install
  community.general.homebrew:
    name: git
    state: latest

- name: Add Global Gitignore
  ansible.builtin.template:
    src: templates/gitignore_global.j2
    dest: "{{ ansible_facts.env.HOME }}/.gitignore_global"
    mode: '0644'

# no_log hides vault values in task output and CI logs.
- name: Set Git configurations
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: 'core.excludesFile', value: "{{ ansible_facts.env.HOME }}/.gitignore_global" }
    - { name: 'init.defaultBranch', value: 'main' }
    - { name: 'user.name', value: "{{ git_user }}", secret: true }
    - { name: 'user.email', value: "{{ git_mail }}", secret: true }
    - { name: 'alias.pushall', value: '!git push --all && git push --tags' }
  loop_control:
    label: "{{ item.name }}"
  when: item.value is defined and item.value | string | length > 0
  no_log: "{{ item.secret | default(false) }}"
