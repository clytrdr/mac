# Dependabot updates pinned action SHAs (see .github/dependabot.yml).

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # ansible.cfg names both password files, and Ansible fails when a file
      # is missing or empty. ansible-lint does not decrypt or escalate, so
      # dummy values are enough.
      - name: Create dummy password files
        run: |
          printf 'dummy' > .vault_pass
          printf 'dummy' > .ansible_become_pass
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  test-playbook:
    needs: lint
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      # ansible.cfg names both password files, and Ansible rejects an empty
      # password file. The runner has passwordless sudo, so sudo never asks
      # for the dummy become password.
      - name: Create password files
        run: |
          if [ -z "$ANSIBLE_VAULT_PASSWORD" ]; then
            echo "::error::ANSIBLE_VAULT_PASSWORD secret is not set" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault_pass
          printf 'dummy' > .ansible_become_pass
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      - name: Run syntax check
        run: ansible-playbook localhost.yml --syntax-check
      - name: Run dry-run
        run: ansible-playbook localhost.yml --check
      - name: Clean up password files
        if: always()
        run: rm -f .vault_pass .ansible_become_pass
