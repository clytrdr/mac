name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

jobs:
  lint:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test-playbook:
    name: Test Ansible Playbook
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    needs: lint
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip3 install -r requirements.txt

      - name: Create vault password file from GitHub Secret
        run: |
          umask 077
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault_pass
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

      - name: Run syntax check
        run: ansible-playbook localhost.yml --syntax-check --vault-password-file .vault_pass

      - name: Run dry-run
        run: ansible-playbook localhost.yml --check --vault-password-file .vault_pass

      - name: Clean up vault password file
        if: always()
        run: rm -f .vault_pass
