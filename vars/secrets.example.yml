# Keys that vars/secrets.yml must contain. The values here are placeholders.
# This file is not encrypted and the playbook does not read it.
# When a role uses a new vault variable, add its key here too.
# To start a new vault from this file:
#   cp vars/secrets.example.yml vars/secrets.yml
#   (edit the values)
#   ansible-vault encrypt vars/secrets.yml

# Git username. Used in roles/git/tasks/main.yml.
git_user: your-name
# Git email address. Used in roles/git/tasks/main.yml.
git_mail: you@example.com
# Firecrawl API key for the MCP server. Used in roles/ai/vars/main.yml.
firecrawl_api_key: fc-xxxxxxxxxxxxxxxx
